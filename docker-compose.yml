version: '3.8'

services:
  honeypot:
    build: .
    container_name: brunswickpot
    hostname: honeypot-server
    ports:
      # Map container ports to host ports
      # Format: "host_port:container_port"
      - "2222:2222"   # SSH
      - "8000:8000"   # HTTP
      - "3389:3389"   # LDAP
      - "4445:4445"   # SMB
    volumes:
      # Persist data directory
      - ./data:/app/data
      # Mount config for easy editing
      - ./honeypot_config.yaml:/app/honeypot_config.yaml:ro
      # Optional: Mount GeoIP databases if you have them
      # - ./geoip:/var/lib/GeoIP:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    restart: unless-stopped
    networks:
      - honeypot-net
    # Optional: Add resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M

  # Optional: Kafka service for event streaming
  # Uncomment if you want to run Kafka in the same stack
  # kafka:
  #   image: bitnami/kafka:latest
  #   container_name: kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     - KAFKA_CFG_NODE_ID=0
  #     - KAFKA_CFG_PROCESS_ROLES=controller,broker
  #     - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
  #     - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
  #     - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
  #     - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
  #   volumes:
  #     - kafka_data:/bitnami/kafka
  #   networks:
  #     - honeypot-net

  # Optional: Elasticsearch for event storage
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
  #   container_name: elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - es_data:/usr/share/elasticsearch/data
  #   networks:
  #     - honeypot-net

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - honeypot-net

networks:
  honeypot-net:
    driver: bridge

volumes:
  kafka_data:
  es_data:
  redis_data:
